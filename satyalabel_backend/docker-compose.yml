services:
  # ── FastAPI Application ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satyalabel_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://satyalabel:satyalabel@db:5432/satyalabel
      - DATABASE_URL_SYNC=postgresql+psycopg2://satyalabel:satyalabel@db:5432/satyalabel
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - TESSERACT_CMD=/usr/bin/tesseract
      - DEBUG=true
      - ENV=development
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - satyalabel_net

  # ── Celery Worker (async OCR jobs) ─────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satyalabel_worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://satyalabel:satyalabel@db:5432/satyalabel
      - DATABASE_URL_SYNC=postgresql+psycopg2://satyalabel:satyalabel@db:5432/satyalabel
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - TESSERACT_CMD=/usr/bin/tesseract
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    depends_on:
      - redis
      - db
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    networks:
      - satyalabel_net

  # ── PostgreSQL + PostGIS ───────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: satyalabel_db
    environment:
      POSTGRES_USER: satyalabel
      POSTGRES_PASSWORD: satyalabel
      POSTGRES_DB: satyalabel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satyalabel"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - satyalabel_net

  # ── Redis (Celery broker + result backend) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: satyalabel_redis
    ports:
      - "6379:6379"
    networks:
      - satyalabel_net

volumes:
  postgres_data:
  uploads_data:

networks:
  satyalabel_net:
    driver: bridge
