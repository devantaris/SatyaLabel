# SatyaLabel nginx edge proxy.
#
# TLS: this config serves HTTP on :80. To enable HTTPS:
#   1. Point your domain's DNS at this server.
#   2. certbot certonly --webroot -w /var/www/certbot -d api.yourdomain.in
#   3. Uncomment the server block below, mount the certs directory
#      (see docker-compose.prod.yml), and reload nginx.
# Or terminate TLS at your cloud load balancer and keep this as-is.

upstream satyalabel_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Multipart label uploads up to 10 MB + form overhead.
    client_max_body_size 12m;

    gzip on;
    gzip_types application/json application/javascript text/css;

    # Certbot HTTP-01 challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://satyalabel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # sync scans can take a while on slow CPUs
    }
}

