# SatyaLabel — production stack.
#
# Usage:
#   cp .env.prod.example .env.prod   # then edit secrets
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# NOTE: --env-file is required — compose variable interpolation
# (${POSTGRES_PASSWORD}) reads it; env_file only feeds container
# environments.
#
# Differences from the dev compose: no source mounts, images built from
# Dockerfile.prod, migrations run automatically at startup, restart
# policies, resource limits, and nginx as the edge proxy.
#
# TLS: terminate at nginx (see deploy/nginx.conf) or at your cloud
# load balancer. A strong SECRET_KEY is mandatory — the app refuses to
# start in ENV=production without one.

name: satyalabel-prod

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://satyalabel:${POSTGRES_PASSWORD}@db:5432/satyalabel
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ENV: production
      DEBUG: "false"
      TESSERACT_CMD: /usr/bin/tesseract
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://satyalabel:${POSTGRES_PASSWORD}@db:5432/satyalabel
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ENV: production
      DEBUG: "false"
      TESSERACT_CMD: /usr/bin/tesseract
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: satyalabel
      POSTGRES_USER: satyalabel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satyalabel -d satyalabel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      # - "443:443"   # enable after provisioning TLS certificates
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  uploads_data:
