[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "satyalabel-backend"
version = "0.1.0"
description = "SatyaLabel — Legal Metrology Packaged Commodity Compliance Scanner (SIH 2026, SIH26034)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Team The Hippos" }]

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # Async task queue
    "celery>=5.4.0",
    "redis>=5.0.4",

    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "geoalchemy2>=0.15.2",

    # OCR
    "pytesseract>=0.3.10",
    "easyocr>=1.7.1",

    # Image processing
    "opencv-python-headless>=4.9.0.80",
    "Pillow>=10.3.0",
    "numpy>=1.26.4",
    "scikit-image>=0.23.2",

    # PDF report generation
    "reportlab>=4.2.0",
    "Jinja2>=3.1.4",

    # Utilities
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dateutil>=2.9.0",
    "httpx>=0.27.0",
    "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line-too-long — pre-existing; cleanup later
    "B008",   # function-call-in-default-argument — FastAPI Depends/Form idiom
    "B904",   # raise-without-from-inside-except — HTTPException pattern
    "UP042",  # StrEnum migration — keep (str, Enum) for Pydantic compatibility
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
